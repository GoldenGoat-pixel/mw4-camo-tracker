<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MW4 Camo Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #0d0e0c;
  --panel: #151714;
  --panel-2: #1b1e1a;
  --line: #262a24;
  --line-2: #343a31;
  --fg: #e4e2da;
  --fg-2: #9c9d92;
  --fg-3: #5f625a;
  --accent: #e2b341;

  --military: #6f8a3c;
  --special: #3f8f84;
  --gold: #d6a93a;
  --platinum: #a9b8c8;
  --harmonic: #9065c9;
  --divergence: #d0453b;

  --cell: 34px;
  --name-w: 148px;
  --display: 'Saira Condensed', 'Arial Narrow', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --body: 'Barlow', system-ui, sans-serif;
}
@media (max-width: 640px) {
  :root { --cell: 31px; --name-w: 108px }
}

* , *::before, *::after { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.4 var(--body);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 48px 48px;
  background-position: -1px -1px;
  background-attachment: fixed;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background: radial-gradient(ellipse at 50% 0%, transparent 0%, var(--bg) 70%);
}
button { font: inherit; color: inherit }
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px 64px }

/* Top bar */
.top {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  padding: 28px 0 18px; flex-wrap: wrap;
}
.brand { font-family: var(--display); line-height: 1 }
.brand small {
  display: block; font-size: 12px; font-weight: 600; letter-spacing: 3px;
  color: var(--accent); margin-bottom: 6px;
}
.brand h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase }
.overall { text-align: right; font-family: var(--mono) }
.overall .big { font-size: 28px; font-weight: 600; letter-spacing: -1px }
.overall .big span { color: var(--fg-3); font-size: 18px }
.overall .lbl { font-size: 11px; color: var(--fg-2); letter-spacing: 2px; text-transform: uppercase }

.tierbar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  border: 1px solid var(--line-2); background: var(--panel);
}
.tierbar > div { padding: 10px 14px; border-left: 1px solid var(--line-2) }
.tierbar > div:first-child { border-left: 0 }
.tierbar .n { font-family: var(--mono); font-size: 20px; font-weight: 600 }
.tierbar .n span { color: var(--fg-3); font-size: 13px; font-weight: 400 }
.tierbar .t {
  font-family: var(--display); font-size: 12px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--fg-2); display: flex; align-items: center; gap: 6px;
}
.tierbar .t i { width: 8px; height: 8px; display: inline-block }
.progress { height: 3px; background: var(--line); position: relative; overflow: hidden }
.progress b { position: absolute; inset: 0 auto 0 0; background: var(--accent); transition: width .3s ease }
@media (max-width: 520px) {
  .tierbar { grid-template-columns: repeat(2, 1fr) }
  .tierbar > div:nth-child(3) { border-left: 0 }
  .tierbar > div:nth-child(n+3) { border-top: 1px solid var(--line-2) }
}

/* Filters */
.filters {
  position: sticky; top: 0; z-index: 30; background: var(--bg);
  padding: 12px 0; margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  border-bottom: 1px solid var(--line);
}
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1 1 420px; min-width: 0 }
.chips::-webkit-scrollbar { display: none }
.chip {
  flex: none; padding: 6px 11px; border: 1px solid var(--line-2); background: var(--panel);
  font-family: var(--display); font-size: 13px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; color: var(--fg-2); cursor: pointer;
}
.chip:hover { color: var(--fg); border-color: var(--fg-3) }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #17140b }
.search {
  flex: 0 1 200px; min-width: 140px; padding: 7px 10px; background: var(--panel);
  border: 1px solid var(--line-2); color: var(--fg); font: 14px var(--body);
}
.search:focus { outline: none; border-color: var(--accent) }
.hide-done { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-2); cursor: pointer; user-select: none }
.hide-done input { accent-color: var(--accent) }

/* Matrix */
.matrix-scroll { margin-top: 14px; overflow-x: auto; overscroll-behavior-x: contain }
table.matrix { border-collapse: separate; border-spacing: 0; width: max-content; margin: 0 auto }
.matrix th, .matrix td { padding: 0 }
.matrix .namecol {
  position: sticky; left: 0; z-index: 2; background: var(--bg);
  width: var(--name-w); min-width: var(--name-w); max-width: var(--name-w); text-align: left;
}
.matrix .gap { width: 10px; min-width: 10px }

tr.cls th { padding-top: 28px }
tr.cls .namecol { vertical-align: bottom; padding-bottom: 6px }
.cls-name { font-family: var(--display); font-size: 15px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase }
.cls-meta { font-family: var(--mono); font-size: 11px; color: var(--fg-3) }
.collbl {
  font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: 1px;
  color: var(--fg-3); text-align: center; vertical-align: bottom; padding-bottom: 6px;
}
.collbl { position: relative }
.grouplbl {
  position: absolute; left: 1px; bottom: 22px; font-size: 10px; letter-spacing: 1.5px;
  text-align: left; white-space: nowrap; color: var(--fg-2);
}

.gun {
  display: flex; flex-direction: column; justify-content: center; width: 100%; height: var(--cell);
  padding: 0 10px 0 0; border: 0; background: none; text-align: left; cursor: pointer;
}
.gun .nm {
  font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gun .ct { font-family: var(--mono); font-size: 10px; color: var(--fg-3); line-height: 1 }
.gun:hover .nm { color: var(--accent) }
tr.row.done .gun .nm { color: var(--gold) }
@media (max-width: 640px) { .gun .nm { font-size: 13px } }

.c {
  width: var(--cell); height: var(--cell); margin: 1px; display: grid; place-items: center;
  border: 1px solid var(--line-2); background: var(--panel); cursor: pointer;
  font-family: var(--mono); font-size: 12px; color: var(--fg-2);
  transition: background .12s, border-color .12s, color .12s;
}
.c:hover { border-color: var(--fg-3); color: var(--fg) }
.c:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; position: relative; z-index: 1 }
.c.na { color: var(--fg-3) }
.c[aria-pressed="true"] { color: #fff; font-weight: 600 }
.c[aria-pressed="true"][data-t="military"]   { background: var(--military);   border-color: var(--military) }
.c[aria-pressed="true"][data-t="special"]    { background: var(--special);    border-color: var(--special) }
.c[aria-pressed="true"][data-t="gold"]       { background: var(--gold);       border-color: var(--gold);     color: #1c1606 }
.c[aria-pressed="true"][data-t="platinum"]   { background: var(--platinum);   border-color: var(--platinum); color: #12161b }
.c[aria-pressed="true"][data-t="harmonic"]   { background: var(--harmonic);   border-color: var(--harmonic) }
.c[aria-pressed="true"][data-t="divergence"] { background: var(--divergence); border-color: var(--divergence) }
.c.locked {
  color: var(--fg-3); border-color: var(--line); cursor: not-allowed;
  background: repeating-linear-gradient(-45deg, var(--panel) 0 4px, var(--bg) 4px 7px);
}
.c.next { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.c.pop { animation: pop .25s ease }
@keyframes pop { 50% { transform: scale(1.12) } }
@media (prefers-reduced-motion: reduce) { .c.pop { animation: none } .progress b { transition: none } }

.empty { text-align: center; color: var(--fg-3); padding: 40px 0 }
.legend {
  display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 12px; color: var(--fg-3)
}
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 12px; height: 12px; border: 1px solid var(--line-2); display: inline-block }

/* Mastery */
.mastery { margin-top: 48px }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line-2); padding-bottom: 8px }
.sec-h h2 { margin: 0; font-family: var(--display); font-size: 22px; letter-spacing: 1.5px; text-transform: uppercase }
.sec-h p { margin: 0; font-size: 13px; color: var(--fg-2) }
.chains { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line-2); border: 1px solid var(--line-2); margin-top: 14px }
@media (max-width: 720px) { .chains { grid-template-columns: 1fr } }
.chain { background: var(--panel); padding: 14px }
.chain h3 { margin: 0 0 10px; font-family: var(--display); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--fg-2) }
.step {
  display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; width: 100%;
  padding: 8px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer;
}
.step:first-of-type { border-top: 0 }
.step .box {
  width: 26px; height: 26px; border: 1px solid var(--line-2); display: grid; place-items: center;
  font-size: 14px; color: transparent;
}
.step[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: #17140b }
.step .nm { font-weight: 600 }
.step .rq { font-size: 13px; color: var(--fg-2) }
.step.locked { cursor: not-allowed; opacity: .45 }
.step:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.tag { font-family: var(--mono); font-size: 10px; color: var(--accent); border: 1px solid currentColor; padding: 0 4px; margin-left: 6px; vertical-align: 1px }

.foot { margin-top: 40px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--fg-3) }
.linkbtn { background: none; border: 0; padding: 0; color: var(--fg-3); text-decoration: underline; cursor: pointer; font-size: 12px }
.linkbtn:hover { color: var(--divergence) }

/* Detail sheet */
dialog {
  border: 1px solid var(--line-2); background: var(--panel); color: var(--fg);
  padding: 0; width: min(560px, calc(100% - 24px)); max-height: 86dvh;
}
dialog::backdrop { background: rgba(0,0,0,.65) }
@media (max-width: 640px) {
  dialog { margin: auto 0 0; width: 100%; max-width: 100%; border-width: 1px 0 0 }
}
.sheet-h { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 18px 18px 12px; border-bottom: 1px solid var(--line-2); position: sticky; top: 0; background: var(--panel) }
.sheet-h h2 { margin: 0; font-family: var(--display); font-size: 26px; text-transform: uppercase; letter-spacing: 1px; line-height: 1 }
.sheet-h .sub { font-size: 12px; color: var(--fg-2); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px }
.x { border: 1px solid var(--line-2); background: none; width: 32px; height: 32px; cursor: pointer; font-size: 18px; line-height: 1 }
.x:hover { border-color: var(--fg-3) }
.sheet-b { padding: 4px 18px 20px; overflow-y: auto }
.req { display: grid; grid-template-columns: 4px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line) }
.req:last-child { border-bottom: 0 }
.req > i { align-self: stretch }
.req .rn { font-weight: 600 }
.req .rn em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--fg-3); margin-left: 6px }
.req .rd { font-size: 13px; color: var(--fg-2); margin-top: 2px }
.req .rd b { color: var(--fg); font-weight: 500 }
.req .unk { color: var(--fg-3); font-style: italic }
.note { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--line-2); font-size: 12px; color: var(--fg-2) }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  background: var(--panel-2); border: 1px solid var(--line-2); border-left: 3px solid var(--accent);
  padding: 10px 14px; font-size: 14px; display: flex; gap: 14px; align-items: center;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; text-transform: uppercase; font-size: 12px; letter-spacing: 1px }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small>MODERN WARFARE 4</small><h1>Camo Tracker</h1></div>
    <div class="overall"><div class="big" id="ov-n"></div><div class="lbl">Camos unlocked</div></div>
  </header>
  <div class="progress"><b id="ov-bar"></b></div>
  <section class="tierbar" id="tierbar" aria-label="Completionist progress"></section>

  <div class="filters">
    <div class="chips" id="chips" role="group" aria-label="Weapon class"></div>
    <input class="search" id="search" type="search" placeholder="Find a gun" aria-label="Find a gun">
    <label class="hide-done"><input type="checkbox" id="hide-done"> Hide finished</label>
  </div>

  <div class="matrix-scroll"><table class="matrix" id="matrix"></table></div>
  <div class="legend">
    <span><i style="border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)"></i>Next to unlock</span>
    <span><i style="background:repeating-linear-gradient(-45deg,var(--panel) 0 3px,var(--bg) 3px 5px)"></i>Locked</span>
    <span>Numbers are the weapon level each military camo unlocks at. Tap a level to mark everything up to it.</span>
    <span>Tap a gun name for its challenges.</span>
  </div>

  <section class="mastery">
    <div class="sec-h"><h2>Mastery &amp; Prestige</h2><p id="mastery-sub"></p></div>
    <div class="chains" id="chains"></div>
  </section>

  <footer class="foot">
    <span>Progress is saved in this browser only.</span>
    <button class="linkbtn" id="reset">Reset all progress</button>
  </footer>
</div>

<dialog id="sheet" aria-labelledby="sheet-title"></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const KEY = 'mw4_camo_tracker';
let state = load();
let view = { cls: 'all', q: '', hideDone: false };
let undoSnap = null;

function load() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  for (const w of WEAPONS) {
    if (!Array.isArray(s[w.id]) || s[w.id].length !== SLOTS) s[w.id] = Array(SLOTS).fill(false);
  }
  if (!s._mastery || typeof s._mastery !== 'object') s._mastery = {};
  for (const m of MASTERY_FLAT) if (typeof s._mastery[m.id] !== 'boolean') s._mastery[m.id] = false;
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- rules ---------- */
const done = (id, i) => state[id][i];
const count = i => WEAPONS.filter(w => state[w.id][i]).length;
const milDone = id => state[id].slice(0, 8).every(Boolean);
const classGold = cls => WEAPONS.filter(w => w.cls === cls).every(w => state[w.id][GOLD]);
const tierOf = i => i < 8 ? 'military' : i < 11 ? 'special' : COMP[i - 11].t;

// Returns a sentence explaining why slot i is locked, or null if it can be ticked.
function lockReason(w, i) {
  if (i < 8) return null;
  if (i < 11) return milDone(w.id) ? null : 'Finish all 8 military camos first';
  if (i === GOLD) return [8, 9, 10].every(k => done(w.id, k)) ? null : 'Finish all 3 special camos first';
  if (i === PLAT) return classGold(w.cls) ? null : `Needs Gold on every ${CLASSES.find(c => c.id === w.cls).short}`;
  if (i === HB) return count(PLAT) >= N ? null : `Needs Platinum on all ${N} weapons (${count(PLAT)}/${N})`;
  if (i === DIV) return count(HB) >= N ? null : `Needs Harmonic Break on all ${N} weapons (${count(HB)}/${N})`;
}
function masteryLock(m) {
  if (m.prev) return state._mastery[m.prev] ? null : `Unlock ${MASTERY_FLAT.find(x => x.id === m.prev).name} first`;
  if (m.first === 'hb') return count(HB) >= N ? null : `Needs Harmonic Break on all ${N} weapons`;
  return null;
}

// Unticking a lower tier can invalidate higher ones (e.g. losing one Gold
// drops Platinum for the whole class). Clear those until nothing changes.
function cascade() {
  let cleared = 0, changed = true;
  while (changed) {
    changed = false;
    for (const w of WEAPONS) for (let i = 8; i < SLOTS; i++) {
      if (state[w.id][i] && lockReason(w, i)) { state[w.id][i] = false; cleared++; changed = true; }
    }
    for (const m of MASTERY_FLAT) {
      if (state._mastery[m.id] && masteryLock(m)) { state._mastery[m.id] = false; cleared++; changed = true; }
    }
  }
  return cleared;
}

function toggle(wid, i) {
  const w = BY_ID[wid];
  const why = lockReason(w, i);
  if (why) return toast(why);
  const snap = JSON.stringify(state);
  const row = state[wid];
  if (i < 8) {
    // Military camos unlock by weapon level, so reaching one implies every lower one.
    const top = row.slice(0, 8).lastIndexOf(true);
    const to = i === top ? i - 1 : i;
    for (let k = 0; k < 8; k++) row[k] = k <= to;
  } else {
    row[i] = !row[i];
  }
  afterChange(snap, `#c-${wid}-${i}`);
}

function toggleMastery(id) {
  const m = MASTERY_FLAT.find(x => x.id === id);
  const why = masteryLock(m);
  if (why) return toast(why);
  const snap = JSON.stringify(state);
  state._mastery[id] = !state._mastery[id];
  afterChange(snap, `#m-${id}`);
}

function afterChange(snap, focusSel) {
  const cleared = cascade();
  save();
  render(focusSel);
  if (cleared) {
    undoSnap = snap;
    toast(`Also cleared ${cleared} camo${cleared > 1 ? 's' : ''} that depended on it`, 'Undo');
  }
}

/* ---------- render ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render(focusSel) {
  renderStats();
  renderChips();
  renderMatrix();
  renderMastery();
  if (focusSel) {
    const el = $(focusSel);
    if (el) { el.focus({ preventScroll: true }); el.classList.add('pop'); }
  }
}

function renderStats() {
  const total = N * SLOTS;
  const got = WEAPONS.reduce((s, w) => s + state[w.id].filter(Boolean).length, 0);
  $('#ov-n').innerHTML = `${got}<span> / ${total}</span>`;
  $('#ov-bar').style.width = (got / total * 100) + '%';
  $('#tierbar').innerHTML = COMP.map(c =>
    `<div><div class="t"><i style="background:var(--${c.t})"></i>${c.name}</div><div class="n">${count(c.i)}<span> / ${N}</span></div></div>`
  ).join('');
}

function renderChips() {
  const chip = (id, label) =>
    `<button class="chip" data-cls="${id}" aria-pressed="${view.cls === id}">${label}</button>`;
  $('#chips').innerHTML = chip('all', 'All') + CLASSES.map(c => chip(c.id, c.short)).join('');
}

function nextSlot(w) {
  for (let i = 0; i < SLOTS; i++) if (!state[w.id][i]) return lockReason(w, i) ? -1 : i;
  return -1;
}

function renderMatrix() {
  const q = view.q.trim().toLowerCase();
  let html = '';
  for (const c of CLASSES) {
    if (view.cls !== 'all' && view.cls !== c.id) continue;
    const guns = WEAPONS.filter(w => w.cls === c.id)
      .filter(w => !q || w.name.toLowerCase().includes(q))
      .filter(w => !view.hideDone || !state[w.id].every(Boolean));
    if (!guns.length) continue;
    const all = WEAPONS.filter(w => w.cls === c.id);
    const gold = all.filter(w => state[w.id][GOLD]).length;
    html += `<tr class="cls">
      <th class="namecol" scope="rowgroup"><div class="cls-name">${c.name}</div><div class="cls-meta">${gold}/${all.length} gold</div></th>
      ${[1,2,3,4,5,6,7,8].map(n => `<th class="collbl" scope="col">${n === 1 ? '<span class="grouplbl">MILITARY &middot; UNLOCKS AT WEAPON LEVEL</span>' : ''}M${n}</th>`).join('')}
      <th class="gap"></th>
      ${[1,2,3].map(n => `<th class="collbl" scope="col">${n === 1 ? '<span class="grouplbl">SPECIAL</span>' : ''}S${n}</th>`).join('')}
      <th class="gap"></th>
      ${COMP.map((x, k) => `<th class="collbl" scope="col" title="${x.name}">${k === 0 ? '<span class="grouplbl">COMPLETIONIST</span>' : ''}${x.glyph}</th>`).join('')}
    </tr>`;
    for (const w of guns) html += rowHtml(w);
  }
  $('#matrix').innerHTML = html || '<tr><td class="empty">No guns match that filter.</td></tr>';
}

function rowHtml(w) {
  const row = state[w.id];
  const got = row.filter(Boolean).length;
  const nx = nextSlot(w);
  const cell = i => {
    const on = row[i];
    const why = on ? null : lockReason(w, i);
    let label, aria;
    if (i < 8) {
      const lv = w.mil[i];
      label = lv ?? '?';
      aria = `Military camo ${i + 1}, unlocks at weapon level ${lv ?? 'unknown'}`;
    } else if (i < 11) {
      const sp = w.sp[i - 8];
      label = ['I', 'II', 'III'][i - 8];
      aria = `Special ${i - 7}${sp && sp.name ? ', ' + sp.name : ''}`;
    } else {
      label = COMP[i - 11].glyph;
      aria = COMP[i - 11].name;
    }
    const cls = ['c', why ? 'locked' : '', i === nx ? 'next' : '', i < 8 && w.mil[i] == null ? 'na' : ''].join(' ');
    return `<td><button class="${cls}" id="c-${w.id}-${i}" data-w="${w.id}" data-i="${i}" data-t="${tierOf(i)}"
      aria-pressed="${on}" aria-label="${esc(w.name)}: ${esc(aria)}${why ? ' (locked)' : ''}" title="${esc(why || aria)}">${label}</button></td>`;
  };
  return `<tr class="row${got === SLOTS ? ' done' : ''}">
    <th class="namecol" scope="row"><button class="gun" data-detail="${w.id}"><span class="nm">${esc(w.name)}</span><span class="ct">${got}/${SLOTS}</span></button></th>
    ${[0,1,2,3,4,5,6,7].map(cell).join('')}<td class="gap"></td>
    ${[8,9,10].map(cell).join('')}<td class="gap"></td>
    ${[11,12,13,14].map(cell).join('')}
  </tr>`;
}

function renderMastery() {
  const hb = count(HB);
  $('#mastery-sub').textContent = `Harmonic Break ${hb}/${N}`;
  $('#chains').innerHTML = MASTERY.map(c => `<div class="chain"><h3>${c.chain}</h3>${
    c.items.map(m => {
      const mm = MASTERY_FLAT.find(x => x.id === m.id);
      const on = state._mastery[m.id];
      const why = on ? null : masteryLock(mm);
      return `<button class="step${why ? ' locked' : ''}" id="m-${m.id}" data-m="${m.id}" aria-pressed="${on}" title="${esc(why || '')}">
        <span class="box">✓</span>
        <span><span class="nm">${m.name}</span>${m.unconfirmed ? '<span class="tag">UNCONFIRMED</span>' : ''}
        <span class="rq" style="display:block">${esc(why || m.req)}</span></span>
      </button>`;
    }).join('')
  }</div>`).join('');
}

/* ---------- detail sheet ---------- */
function challenge(c) {
  if (!c || (!c.mp && !c.dmz)) return '<span class="unk">Not published yet</span>';
  return [c.mp && `<b>MP</b> ${esc(c.mp)}`, c.dmz && `<b>DMZ</b> ${esc(c.dmz)}`].filter(Boolean).join(' &middot; ');
}
function openDetail(wid) {
  const w = BY_ID[wid];
  const cls = CLASSES.find(c => c.id === w.cls);
  const lv = w.mil.map((l, k) => `M${k + 1} ${l ?? '?'}`).join(' &middot; ');
  const items = [
    { t: 'military', n: 'Military', em: '8 camos', d: `Unlock by weapon level: ${lv}` },
    ...w.sp.map((s, k) => ({ t: 'special', n: (s && s.name) || `Special ${k + 1}`, em: `S${k + 1}`, d: challenge(s) })),
    { t: 'gold', n: 'Gold', em: 'after all specials', d: challenge(w.gold || DATA.gold) },
    { t: 'platinum', n: 'Platinum', em: `after Gold on every ${cls.short}`, d: challenge(DATA.platinum[w.cls]) },
    { t: 'harmonic', n: 'Harmonic Break', em: `after ${N} Platinum`, d: challenge(DATA.harmonic[w.cls]) },
    { t: 'divergence', n: 'Divergence', em: `after ${N} Harmonic Break`, d: DATA.divergence ? esc(DATA.divergence) : '<span class="unk">Not published yet</span>' },
  ];
  const sheet = $('#sheet');
  sheet.innerHTML = `<div class="sheet-h"><div><h2 id="sheet-title">${esc(w.name)}</h2><div class="sub">${cls.name}</div></div>
    <button class="x" data-close aria-label="Close">&times;</button></div>
    <div class="sheet-b">${items.map(r =>
      `<div class="req"><i style="background:var(--${r.t})"></i><div><div class="rn">${esc(r.n)}<em>${esc(r.em)}</em></div><div class="rd">${r.d}</div></div></div>`
    ).join('')}${w.notes ? `<div class="note">Source note: ${esc(w.notes)}</div>` : ''}</div>`;
  sheet.showModal();
}

/* ---------- toast & confirm ---------- */
let toastTimer;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button data-undo>${action}</button>` : ''}`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); undoSnap = null; }, action ? 5000 : 2200);
}

function confirmReset() {
  const d = $('#confirm');
  d.innerHTML = `<div class="sheet-h"><div><h2 id="confirm-title">Reset everything?</h2><div class="sub">Clears every camo and mastery tick in this browser</div></div></div>
    <div class="sheet-b" style="display:flex;gap:10px;justify-content:flex-end;padding-top:16px">
      <button class="chip" data-close>Cancel</button>
      <button class="chip" data-do-reset style="background:var(--divergence);border-color:var(--divergence);color:#fff">Reset</button>
    </div>`;
  d.showModal();
}

/* ---------- events (bound once) ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const cell = t.closest('.c');
  if (cell) return toggle(cell.dataset.w, +cell.dataset.i);
  const gun = t.closest('[data-detail]');
  if (gun) return openDetail(gun.dataset.detail);
  const step = t.closest('.step');
  if (step) return toggleMastery(step.dataset.m);
  const chip = t.closest('.chip[data-cls]');
  if (chip) { view.cls = chip.dataset.cls; renderChips(); renderMatrix(); return; }
  if (t.closest('[data-undo]') && undoSnap) {
    state = JSON.parse(undoSnap); undoSnap = null; save(); render(); toast('Restored'); return;
  }
  if (t.closest('[data-close]')) return t.closest('dialog').close();
  if (t.closest('[data-do-reset]')) {
    try { localStorage.removeItem(KEY); } catch (e) {}
    state = load(); save();
    $('#confirm').close(); render(); toast('Progress reset'); return;
  }
  if (t.closest('#reset')) return confirmReset();
  // Click on the dialog backdrop lands on the dialog element itself.
  if (t.tagName === 'DIALOG') t.close();
});
$('#search').addEventListener('input', e => { view.q = e.target.value; renderMatrix(); });
$('#hide-done').addEventListener('change', e => { view.hideDone = e.target.checked; renderMatrix(); });

render();
</script>
</body>
</html>
